<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Cycle — Period Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
  /* ============ TOKENS ============ */
  :root{
    --ink:      #422427;
    --white:    #ffffff;

    --ink-08:   rgba(66, 36, 39, .08);
    --ink-12:   rgba(66, 36, 39, .12);
    --ink-45:   rgba(66, 36, 39, .45);
    --ink-60:   rgba(66, 36, 39, .60);

    --r-lg: 34px;
    --r-md: 22px;
  }

  *, *::before, *::after{ box-sizing: border-box; }

  html{ -webkit-text-size-adjust: 100%; color-scheme: light; }

  body{
    margin: 0;
    min-height: 100dvh;
    position: relative;
    overflow-x: hidden;
    background: var(--white);
    color: var(--ink);
    font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============ AMBIENT BLOBS (feed the glass effect) ============ */
  .blob{
    position: fixed;
    border-radius: 50%;
    background: var(--ink);
    filter: blur(70px);
    pointer-events: none;
    z-index: 0;
  }
  .b1{ width: 380px; height: 380px; top: -90px;  right: -110px; opacity: .20; }
  .b2{ width: 420px; height: 420px; bottom: -140px; left: -150px; opacity: .12; }

  main{ position: relative; z-index: 1; }

  /* ============ SCREENS ============ */
  .screen{
    display: none;
    flex-direction: column;
    min-height: 100dvh;
    padding: calc(28px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom));
  }
  .screen.active{
    display: flex;
    animation: screenIn .38s cubic-bezier(.2, .7, .3, 1) both;
  }
  @keyframes screenIn{
    from{ opacity: 0; transform: translateY(10px); }
    to  { opacity: 1; transform: none; }
  }

  .wrap{
    display: flex;
    flex-direction: column;
    flex: 1;
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
  }

  /* ============ SCREEN 1 — ONBOARDING ============ */
  #screenOnboard .wrap{
    justify-content: space-between;
    gap: 40px;
    padding-top: 5vh;
  }

  .avatar-block{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .avatar-picker{
    position: relative;
    display: grid;
    place-items: center;
    width: 112px;
    height: 112px;
    border-radius: 50%;
    background-color: var(--ink-08);
    background-size: cover;
    background-position: center;
    cursor: pointer;
    overflow: hidden;
    transition: transform .25s ease, background-color .25s ease;
  }
  .avatar-picker:active{ transform: scale(.96); }
  .avatar-picker .plus{
    font-size: 34px;
    font-weight: 300;
    line-height: 1;
    color: var(--ink);
    opacity: .4;
  }
  .avatar-picker.has-photo .plus{ display: none; }

  .field{
    width: 100%;
    border: 0;
    outline: 0;
    font-family: inherit;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    background: var(--ink-08);
    border-radius: var(--r-md);
    padding: 18px 22px;
    min-height: 58px;
    transition: background-color .2s ease;
  }
  .field::placeholder{ color: var(--ink-45); font-weight: 400; }
  .field:focus{ background: var(--ink-12); }

  #nameInput{
    max-width: 300px;
    text-align: center;
  }

  input[type="date"].field{
    -webkit-appearance: none;
    appearance: none;
  }
  input[type="date"]::-webkit-calendar-picker-indicator{
    opacity: .45;
    cursor: pointer;
    margin-left: 4px;
  }
  input[type="date"]:invalid::-webkit-datetime-edit{ color: var(--ink-45); }

  .onboard-bottom{
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .question{
    margin: 0 0 6px;
    font-size: 23px;
    font-weight: 600;
    letter-spacing: -.02em;
    line-height: 1.28;
  }

  .btn{
    border: 0;
    font-family: inherit;
    font-size: 17px;
    font-weight: 600;
    color: var(--white);
    background: var(--ink);
    border-radius: var(--r-md);
    padding: 19px 24px;
    min-height: 58px;
    cursor: pointer;
    transition: opacity .2s ease, transform .2s ease;
  }
  .btn:disabled{ opacity: .3; cursor: default; }
  .btn:not(:disabled):active{ transform: scale(.985); }

  /* ============ SCREEN 2 — HOME ============ */
  #screenHome .wrap{ gap: 22px; }

  .profile{
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 6px 2px 0;
  }

  .avatar{
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: var(--ink-08) center / cover no-repeat;
    color: var(--ink);
    overflow: hidden;
  }
  .avatar svg{ width: 30px; height: 30px; opacity: .35; }

  .user-name{
    margin: 0;
    font-family: 'Chewy', cursive;
    font-weight: 400;
    font-size: clamp(26px, 8vw, 38px);
    line-height: 1.05;
    letter-spacing: .4px;
    word-break: break-word;
  }

  /* ---- glass calendar ---- */
  .calendar{
    border-radius: var(--r-lg);
    padding: 20px 16px 16px;
    background: rgba(255, 255, 255, .55);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    backdrop-filter: blur(26px) saturate(180%);
    box-shadow: 0 24px 60px -28px rgba(66, 36, 39, .35);
  }

  .cal-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 6px 14px;
  }
  .month-label{
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .01em;
  }
  .nav{
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 50%;
    background: var(--ink-08);
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    transition: background-color .2s ease, transform .2s ease;
  }
  .nav:active{ transform: scale(.92); background: var(--ink-12); }

  .weekdays{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding-bottom: 8px;
  }
  .weekdays span{
    text-align: center;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-45);
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .cell{
    position: relative;
    display: grid;
    place-items: center;
    aspect-ratio: 1 / 1;
    font-size: 14.5px;
    font-weight: 500;
    color: var(--ink);
  }
  .cell .num{ position: relative; z-index: 2; }

  /* contiguous pill spanning the marked days */
  .cell.inrange{ color: var(--white); }
  .cell.inrange::before{
    content: '';
    position: absolute;
    z-index: 1;
    top: 3px;
    bottom: 3px;
    left: 0;
    right: 0;
    background: var(--ink);
  }
  .cell.seg-start::before{
    left: 3px;
    border-radius: 999px 0 0 999px;
  }
  .cell.seg-end::before{
    right: 3px;
    border-radius: 0 999px 999px 0;
  }
  .cell.seg-start.seg-end::before{
    border-radius: 999px;
  }

  /* today dot */
  .cell.today .num::after{
    content: '';
    position: absolute;
    left: 50%;
    bottom: -7px;
    width: 4px;
    height: 4px;
    margin-left: -2px;
    border-radius: 50%;
    background: currentColor;
    opacity: .55;
  }

  .caption{
    margin: 0;
    padding: 0 12px;
    text-align: center;
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink-60);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>

<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <main>
    <!-- ============ SCREEN 1 ============ -->
    <section class="screen active" id="screenOnboard">
      <div class="wrap">

        <div class="avatar-block">
          <label class="avatar-picker" id="avatarPicker" for="avatarInput" aria-label="Choose a profile photo">
            <span class="plus" id="avatarPlus">+</span>
            <input id="avatarInput" type="file" accept="image/*" hidden />
          </label>

          <input id="nameInput" class="field" type="text" placeholder="Your name"
                 maxlength="24" autocomplete="off" spellcheck="false" />
        </div>

        <div class="onboard-bottom">
          <h1 class="question">When did your period start?</h1>
          <input id="startInput" class="field" type="date" required />
          <button id="startBtn" class="btn" type="button" disabled>Continue</button>
        </div>

      </div>
    </section>

    <!-- ============ SCREEN 2 ============ -->
    <section class="screen" id="screenHome">
      <div class="wrap">

        <header class="profile">
          <div class="avatar" id="profilePic">
            <svg id="profileFallback" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="8.5" r="3.5" />
              <path d="M5 19.5c0-3.2 3.1-5.3 7-5.3s7 2.1 7 5.3" />
            </svg>
          </div>
          <h2 class="user-name" id="profileName"></h2>
        </header>

        <div class="calendar">
          <div class="cal-head">
            <button class="nav" id="prevBtn" type="button" aria-label="Previous month">&#8249;</button>
            <span class="month-label" id="monthLabel"></span>
            <button class="nav" id="nextBtn" type="button" aria-label="Next month">&#8250;</button>
          </div>

          <div class="weekdays">
            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
            <span>Thu</span><span>Fri</span><span>Sat</span>
          </div>

          <div class="grid" id="calGrid"></div>
        </div>

        <p class="caption" id="rangeCaption"></p>

      </div>
    </section>
  </main>

<script>
(function () {
  'use strict';

  /* ---------- config ---------- */
  const PERIOD_DAYS = 5;                      // assumed bleeding length
  const KEY = {
    name:   'cycle.name',
    avatar: 'cycle.avatar',
    start:  'cycle.start'
  };

  /* ---------- state ---------- */
  const state = {
    name:   localStorage.getItem(KEY.name)   || '',
    avatar: localStorage.getItem(KEY.avatar) || '',
    start:  localStorage.getItem(KEY.start)  || ''
  };

  let viewYear  = new Date().getFullYear();
  let viewMonth = new Date().getMonth();

  /* ---------- dom ---------- */
  const $ = (id) => document.getElementById(id);

  const screens = {
    onboard: $('screenOnboard'),
    home:    $('screenHome')
  };

  const avatarPicker = $('avatarPicker');
  const avatarInput  = $('avatarInput');
  const nameInput    = $('nameInput');
  const startInput   = $('startInput');
  const startBtn     = $('startBtn');

  const profilePic      = $('profilePic');
  const profileFallback = $('profileFallback');
  const profileName     = $('profileName');

  const monthLabel   = $('monthLabel');
  const prevBtn      = $('prevBtn');
  const nextBtn      = $('nextBtn');
  const calGrid      = $('calGrid');
  const rangeCaption = $('rangeCaption');

  /* ---------- date helpers ---------- */
  const parseISO = (str) => {
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  };

  const addDays = (date, n) => {
    const d = new Date(date);
    d.setDate(d.getDate() + n);
    return d;
  };

  const sameDay = (a, b) =>
    a.getFullYear() === b.getFullYear() &&
    a.getMonth()    === b.getMonth()    &&
    a.getDate()     === b.getDate();

  const toISO = (d) => {
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${d.getFullYear()}-${m}-${day}`;
  };

  const prettyDate = (d) =>
    d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

  /* ---------- avatar helpers ---------- */
  function resizeToSquare(file, size) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();

      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;

        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';                       // only white / ink allowed
        ctx.fillRect(0, 0, size, size);

        const s = Math.min(img.width, img.height);
        ctx.drawImage(
          img,
          (img.width  - s) / 2, (img.height - s) / 2, s, s,
          0, 0, size, size
        );

        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };

      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image load failed')); };
      img.src = url;
    });
  }

  function paintAvatar(url) {
    if (url) {
      avatarPicker.style.backgroundImage = `url("${url}")`;
      avatarPicker.classList.add('has-photo');

      profilePic.style.backgroundImage = `url("${url}")`;
      profileFallback.style.display = 'none';
    } else {
      avatarPicker.style.backgroundImage = '';
      avatarPicker.classList.remove('has-photo');

      profilePic.style.backgroundImage = '';
      profileFallback.style.display = '';
    }
  }

  /* ---------- onboarding ---------- */
  function validate() {
    startBtn.disabled = !(nameInput.value.trim().length > 0 && startInput.value);
  }

  avatarInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file || !file.type.startsWith('image/')) return;

    try {
      const dataUrl = await resizeToSquare(file, 320);
      state.avatar = dataUrl;
      localStorage.setItem(KEY.avatar, dataUrl);
      paintAvatar(dataUrl);
    } catch (err) {
      console.warn(err);
    }
  });

  nameInput.addEventListener('input', validate);
  startInput.addEventListener('input', validate);
  startInput.addEventListener('change', validate);

  startBtn.addEventListener('click', () => {
    state.name  = nameInput.value.trim();
    state.start = startInput.value;

    localStorage.setItem(KEY.name,  state.name);
    localStorage.setItem(KEY.start, state.start);

    goHome();
  });

  /* ---------- calendar ---------- */
  function renderCalendar() {
    const startDate = parseISO(state.start);
    const endDate   = addDays(startDate, PERIOD_DAYS - 1);

    monthLabel.textContent = new Date(viewYear, viewMonth, 1)
      .toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

    calGrid.innerHTML = '';

    const firstWeekday = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth  = new Date(viewYear, viewMonth + 1, 0).getDate();
    const cellsCount   = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;

    const cells = [];

    for (let i = 0; i < cellsCount; i++) {
      const dayNum = i - firstWeekday + 1;
      const cell   = document.createElement('div');
      cell.className = 'cell';

      let inRange = false;

      if (dayNum >= 1 && dayNum <= daysInMonth) {
        const date = new Date(viewYear, viewMonth, dayNum);

        const num = document.createElement('span');
        num.className = 'num';
        num.textContent = dayNum;
        cell.appendChild(num);

        if (date >= startDate && date <= endDate) {
          inRange = true;
          cell.classList.add('inrange');
        }

        if (sameDay(date, new Date())) cell.classList.add('today');
      }

      cell.dataset.range = inRange ? '1' : '0';
      calGrid.appendChild(cell);
      cells.push(cell);
    }

    /* round the ends of every contiguous run, per week row */
    for (let rowStart = 0; rowStart < cells.length; rowStart += 7) {
      const rowEnd = Math.min(rowStart + 7, cells.length);
      let i = rowStart;

      while (i < rowEnd) {
        if (cells[i].dataset.range === '1') {
          let j = i;
          while (j + 1 < rowEnd && cells[j + 1].dataset.range === '1') j++;

          cells[i].classList.add('seg-start');
          cells[j].classList.add('seg-end');
          i = j + 1;
        } else {
          i++;
        }
      }
    }

    rangeCaption.textContent =
      `Started ${prettyDate(startDate)} · expected to finish ${prettyDate(endDate)}`;
  }

  prevBtn.addEventListener('click', () => shiftMonth(-1));
  nextBtn.addEventListener('click', () => shiftMonth(1));

  function shiftMonth(delta) {
    const d = new Date(viewYear, viewMonth + delta, 1);
    viewYear  = d.getFullYear();
    viewMonth = d.getMonth();
    renderCalendar();
  }

  /* ---------- routing ---------- */
  function switchTo(which) {
    Object.keys(screens).forEach((k) => screens[k].classList.remove('active'));
    screens[which].classList.add('active');
    window.scrollTo(0, 0);
  }

  function goHome() {
    profileName.textContent = state.name;
    paintAvatar(state.avatar);

    const start = parseISO(state.start);
    viewYear  = start.getFullYear();
    viewMonth = start.getMonth();

    renderCalendar();
    switchTo('home');
  }

  /* ---------- init ---------- */
  function init() {
    startInput.max = toISO(new Date());   // no future start dates

    if (state.name && state.start) {
      goHome();
      return;
    }

    nameInput.value  = state.name;
    startInput.value = state.start;
    paintAvatar(state.avatar);
    validate();
    switchTo('onboard');
  }

  init();
})();
</script>
</body>
</html>
